name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chloride233/needradar

jobs:
  # ── Docker 镜像构建 & 推送 ──
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docker Compose 冒烟测试 ──
  smoke-test:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取刚构建的镜像
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: 启动后端
        run: |
          docker run -d --name needradar-smoke \
            -p 8000:8000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sleep 5

      - name: 等待健康检查就绪
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/v1/health > /tmp/needradar-health.json; then
              cat /tmp/needradar-health.json
              exit 0
            fi
            if ! docker ps --filter "name=needradar-smoke" --filter "status=running" | grep -q needradar-smoke; then
              echo "Container exited before becoming healthy."
              docker logs needradar-smoke || true
              exit 1
            fi
            sleep 2
          done
          echo "Health check did not become ready in time."
          docker logs needradar-smoke || true
          exit 1

      - name: 验证 Dashboard API
        run: |
          curl -f http://localhost:8000/api/v1/dashboard || exit 1
          curl -f http://localhost:8000/api/v1/verification/results || exit 1
          curl -f http://localhost:8000/api/v1/trending || exit 1
          curl -f http://localhost:8000/api/v1/opportunities || exit 1
          curl -f http://localhost:8000/api/v1/proposals || exit 1
          curl -f "http://localhost:8000/api/v1/links?entity_type=smoke&entity_id=smoke" || exit 1
          curl -f http://localhost:8000/api/v1/scheduler || exit 1

      - name: 清理
        if: always()
        run: |
          docker stop needradar-smoke || true
          docker rm needradar-smoke || true

  # ── GitHub Release（仅 tag 触发） ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成变更日志
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## 自 $PREV_TAG 以来的变更" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "## 首次发布" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi
          cat CHANGELOG.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
