[alembic]
script_location = migrations
prepend_sys_path = .
# URL is set dynamically in migrations/env.py from NR_DATABASE_URL env var.
# This placeholder is overridden at runtime; do not hardcode credentials here.
sqlalchemy.url = sqlite+aiosqlite:///./data/needradar.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
