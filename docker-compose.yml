services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-needradar}
      POSTGRES_USER: ${POSTGRES_USER:-needradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-needradar}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      NR_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-needradar}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-needradar}
      NR_DEEPSEEK_API_KEY: ${NR_DEEPSEEK_API_KEY:-}
      NR_OPENAI_API_KEY: ${NR_OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
